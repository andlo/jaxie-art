name: Execute approved removal

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  execute:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract file path from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          FILE=$(echo "$ISSUE_BODY" | grep -oP '(?<=File: `)[^`]+(?=`)' | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Delete file and commit
        if: steps.extract.outputs.file != ''
        run: |
          FILE="${{ steps.extract.outputs.file }}"
          if [ -f "$FILE" ]; then
            git config user.name "jaxie-art-bot"
            git config user.email "actions@github.com"
            git rm "$FILE"
            git commit -m "Remove drawing (approved in #${{ github.event.issue.number }})"
            git push
          fi

      - name: Comment and close issue
        if: steps.extract.outputs.file != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Approved and removed `${{ steps.extract.outputs.file }}`. This will disappear from the live site within a minute or two."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
