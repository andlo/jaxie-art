<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaxie's Drawings</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <h1>🎨 Jaxie's Drawings</h1>
    <p class="subtitle">A collection of drawings, week by week</p>
    <p class="header-license">
      All drawings are © Jaxie and published under
      <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>
      — you're welcome to view and share them with credit, but not modify them or use them commercially.
    </p>
  </header>

  <div class="filters">
    <label>
      Year
      <select id="filter-year"><option value="">All</option></select>
    </label>
    <label>
      Month
      <select id="filter-month"><option value="">All</option></select>
    </label>
    <label>
      Week
      <select id="filter-week"><option value="">All</option></select>
    </label>
    <input id="search" type="search" placeholder="Search titles…">
    <span id="result-count" class="result-count"></span>
  </div>

  <main id="gallery" class="gallery"></main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">✕</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-meta">
        <p id="lightbox-date"></p>
        <p class="license-note">
          © Jaxie — <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>
        </p>
        <a id="lightbox-download" class="download-btn" download>⬇ Download</a>
        <a id="lightbox-remove" class="remove-btn" target="_blank" rel="noopener">🗑 Request removal</a>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
